# one image, two anchors, five services — a service is a role, not an image. x-store-environment is the store contract:
# the five STORE_*_DIR every config.py reads, one variable per store, plus the thread cap. x-service is what every service of this file is. The three runners — data,
# features, ml — carry no command: a stage is `docker compose run --rm -T <runner> python -m <module>.<stage> --tickers
# <TICKER>`, one one-off container per asset or one for the whole basket, and exits; the two residents — dashboard and
# devops — serve, each under its own command.
# volumes: REPLACES an anchor's key rather than extending it, so every service respells its mounts whole. Every service
# mounts the tree at /app — store/ rides in it, an address no service uses — and at /store/<content> the stores it
# touches, read-only where it only reads, and no other. The project name is fixed:
# liora-dashboard-1, liora-devops-1 on every host — two checkouts on one host share it, so run one at a time or override
# COMPOSE_PROJECT_NAME.
name: liora

x-store-environment: &store_environment
  STORE_RAW_1M_DIR: /store/raw_1m
  STORE_ASSETS_ARTIFACTS_DIR: /store/assets_artifacts
  STORE_TRIALS_DIR: /store/trials
  STORE_RUN_RECORDS_DIR: /store/run_records
  STORE_STATUS_DIR: /store/status
  OMP_NUM_THREADS: "1"

x-service: &service
  build: .
  image: liora-1m-pipeline
  init: true
  user: "${UID:-1000}:${GID:-1000}"
  environment: *store_environment
  volumes:
    - .:/app

services:
  # the data layer writes the raw tree and the asset databases, and its own snapshot
  data:
    <<: *service
    volumes:
      - .:/app
      - ./store/raw_1m:/store/raw_1m
      - ./store/assets_artifacts:/store/assets_artifacts
      - ./store/status:/store/status
  # the feature layer never asks about a venue: it reads the canonical series and writes beside it
  features:
    <<: *service
    volumes:
      - .:/app
      - ./store/assets_artifacts:/store/assets_artifacts
      - ./store/status:/store/status
  # the one task that needs the ceiling: HPO and XGBoost above DuckDB's 4GB memory_limit
  ml:
    <<: *service
    volumes:
      - .:/app
      - ./store/assets_artifacts:/store/assets_artifacts
      - ./store/trials:/store/trials
      - ./store/status:/store/status
    deploy:
      resources:
        limits:
          memory: 5g

  # the dashboard serves and never writes, so its stores are read-only; it mounts the two it serves from, the run
  # records and the snapshots, and no other: nothing it serves is read anywhere else.
  dashboard:
    <<: *service
    command: python -m module_monitoring.serve
    ports:
      - "127.0.0.1:${PORT:-8900}:8900"
    volumes:
      - .:/app
      - ./store/run_records:/store/run_records:ro
      - ./store/status:/store/status:ro

  # the one service that holds the docker socket, and the only one: its whole responsibility is docker management and
  # monitoring. It publishes no port — the dashboard proxies /devops/* to it. It addresses no store; its environment
  # still carries the five store names from the anchor, because its server imports module_monitoring/config.py, which
  # reads two of them at import.
  devops:
    <<: *service
    command: python -m module_monitoring.sub_module_devops.serve
    group_add: ["${DOCKER_GID:-999}"]
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
